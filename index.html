<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천구 좌표 시뮬레이터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#010307;
  color:#d0d8ff;
  font-family:'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

/* ── 배경 별 ── */
.stars{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(30,50,120,0.18) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 70%, rgba(20,40,100,0.14) 0%, transparent 55%);
}
.stars::before,.stars::after{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 80%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 35%, rgba(255,255,255,.65) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,.55) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 5% 70%, rgba(255,255,255,.45) 0%, transparent 100%),
    radial-gradient(1px 1px at 33% 42%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 62% 12%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 77% 88%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 48% 60%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 45%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 3% 38%, rgba(255,255,255,.4) 0%, transparent 100%);
}
.stars::after{
  background-image:
    radial-gradient(1px 1px at 18% 5%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 44% 78%, rgba(255,255,255,.45) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 66% 50%, rgba(255,255,255,.55) 0%, transparent 100%),
    radial-gradient(1px 1px at 81% 22%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 29% 68%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 57% 94%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 95% 75%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 8% 52%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 73% 7%, rgba(255,255,255,.45) 0%, transparent 100%),
    radial-gradient(1px 1px at 38% 30%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 52% 46%, rgba(255,255,255,.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 87% 33%, rgba(255,255,255,.4) 0%, transparent 100%);
  animation: twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{
  0%{opacity:.6} 50%{opacity:1} 100%{opacity:.7}
}

/* ── 천구 장식 ── */
.celestial-ring{
  position:fixed;
  border-radius:50%;
  border:1px solid rgba(60,100,255,0.1);
  pointer-events:none;z-index:0;
  animation:spin linear infinite;
}
.ring1{width:600px;height:600px;top:50%;left:50%;margin:-300px;animation-duration:80s}
.ring2{width:900px;height:900px;top:50%;left:50%;margin:-450px;border-color:rgba(60,100,255,0.06);animation-duration:130s;animation-direction:reverse}
.ring3{width:420px;height:420px;top:50%;left:50%;margin:-210px;border-color:rgba(100,140,255,0.08);animation-duration:55s;transform-origin:center;border-style:dashed}
.ring1::before,.ring2::before{
  content:'';position:absolute;
  width:6px;height:6px;background:#4466ff;border-radius:50%;
  top:50%;left:-3px;margin-top:-3px;
  box-shadow:0 0 8px 2px rgba(80,120,255,0.6);
}
.ring2::before{background:#33ff88;box-shadow:0 0 8px 2px rgba(50,220,120,0.5);}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── 메인 콘텐츠 ── */
.content{
  position:relative;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;text-align:center;
  padding:32px 24px;
  max-width:600px;width:100%;
}

/* ── 타이틀 ── */
.globe-icon{
  font-size:56px;margin-bottom:16px;
  filter:drop-shadow(0 0 24px rgba(80,130,255,0.7));
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}
}

h1{
  font-size:26px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(135deg,#aabbff 0%,#ffffff 45%,#88aaff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:6px;
}
.subtitle{
  font-size:13px;color:rgba(140,160,220,0.7);
  letter-spacing:0.5px;margin-bottom:10px;
}
.desc{
  font-size:12px;color:rgba(100,120,180,0.65);
  line-height:1.7;margin-bottom:32px;
  max-width:420px;
}

/* ── 선택 카드 ── */
.cards{
  display:flex;gap:16px;width:100%;
  justify-content:center;flex-wrap:wrap;
}

.card{
  flex:1;min-width:200px;max-width:240px;
  background:rgba(8,16,44,0.75);
  border:1px solid rgba(70,120,255,0.22);
  border-radius:16px;
  padding:28px 20px 24px;
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition:transform .22s, border-color .22s, box-shadow .22s;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(70,120,255,0.1) 0%, transparent 70%);
  opacity:0;transition:opacity .22s;
}
.card:hover{
  transform:translateY(-5px);
  border-color:rgba(100,160,255,0.5);
  box-shadow:0 12px 40px rgba(50,90,200,0.25);
}
.card:hover::before{opacity:1}

.card-icon{font-size:38px;line-height:1;filter:drop-shadow(0 0 10px rgba(120,160,255,0.5))}
.card-title{font-size:16px;font-weight:700;color:#c8d4ff;letter-spacing:.5px}
.card-sub{font-size:11px;color:rgba(100,130,200,0.7);line-height:1.6;text-align:center}

.card-badge{
  font-size:9px;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;font-weight:600;
}
.badge-pc{
  background:rgba(70,120,255,0.18);
  border:1px solid rgba(70,120,255,0.35);
  color:#88aaff;
}
.badge-mobile{
  background:rgba(50,200,120,0.15);
  border:1px solid rgba(50,200,120,0.35);
  color:#66ddaa;
}

.card-arrow{
  margin-top:4px;font-size:18px;color:rgba(100,140,255,0.5);
  transition:transform .2s, color .2s;
}
.card:hover .card-arrow{transform:translateX(4px);color:rgba(140,180,255,0.9)}

/* PC 카드 호버 색조 */
.card-pc:hover{border-color:rgba(100,140,255,0.55);box-shadow:0 12px 40px rgba(60,100,220,0.28)}
.card-mobile:hover{border-color:rgba(50,210,130,0.45);box-shadow:0 12px 40px rgba(40,180,100,0.2)}
.card-mobile:hover .card-arrow{color:rgba(100,220,160,0.9)}

/* ── 하단 ── */
.footer{
  margin-top:36px;font-size:10px;color:rgba(70,90,140,0.55);
  letter-spacing:.3px;
}
.footer a{color:rgba(90,120,200,0.6);text-decoration:none}
.footer a:hover{color:rgba(130,160,240,0.9)}

/* ── 반응형 ── */
@media(max-width:480px){
  h1{font-size:21px}
  .globe-icon{font-size:44px}
  .cards{flex-direction:column;align-items:center}
  .card{max-width:90%;min-width:0;width:100%}
  .ring1{width:340px;height:340px;margin:-170px}
  .ring2{width:520px;height:520px;margin:-260px}
  .ring3{display:none}
}
</style>
</head>
<body>

<div class="stars"></div>
<div class="celestial-ring ring1"></div>
<div class="celestial-ring ring2"></div>
<div class="celestial-ring ring3"></div>

<div class="content">

  <div class="globe-icon">🌐</div>

  <h1>천구 좌표 시뮬레이터</h1>
  <div class="subtitle">Celestial Coordinate Simulator</div>

  <p class="desc">
    적도 좌표계(RA/Dec)와 지평 좌표계(Az/Alt)를 3D로 시각화합니다.<br>
    두 관측자의 시점, 자동 자전, 역방향 계산을 지원합니다.
  </p>

  <div class="cards">

    <a class="card card-pc" href="celestial_simulator.html">
      <div class="card-icon">🖥️</div>
      <div class="card-title">PC 버전</div>
      <div class="card-sub">마우스 드래그·스크롤 최적화<br>넓은 화면의 멀티패널 UI</div>
      <span class="card-badge badge-pc">Desktop</span>
      <div class="card-arrow">→</div>
    </a>

    <a class="card card-mobile" href="celestial_simulator_mobile.html">
      <div class="card-icon">📱</div>
      <div class="card-title">모바일 버전</div>
      <div class="card-sub">터치·핀치 줌 최적화<br>바텀시트 탭 UI</div>
      <span class="card-badge badge-mobile">Mobile</span>
      <div class="card-arrow">→</div>
    </a>

  </div>

  <div class="footer">
    RA/Dec는 관측자와 무관하게 고정 &nbsp;·&nbsp; Az/Alt는 위치·시간에 따라 변화<br>
    <br>
  </div>

</div>

</body>
</html>
